<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生仪表盘 | Life Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>⚡ 人生仪表盘</h1>
        <p class="subtitle">合肥工业大学 · 应用化学 · 2026级</p>
    </header>

    <main>
        <section class="card">
            <h2>🌳 技能树</h2>
            <div class="skill">
                <div class="skill-header">
                    <span>HTML / CSS</span>
                    <span id="html-skill">55%</span>
                </div>
                <div class="skill-bar">
                    <div class="skill-fill" id="html-skill-bar" style="width: 55%;"></div>
                </div>
            </div>
            <div class="skill">
                <div class="skill-header">
                    <span>Python 基础</span>
                    <span id="python-skill">55%</span>
                </div>
                <div class="skill-bar">
                    <div class="skill-fill" id="python-skill-bar" style="width: 55%;"></div>
                </div>
            </div>
            <div class="skill">
                <div class="skill-header">
                    <span>高等数学</span>
                    <span id="math-skill">5%</span>
                </div>
                <div class="skill-bar">
                    <div class="skill-fill" id="math-skill-bar" style="width: 5%;"></div>
                </div>
            </div>
            <div class="skill">
                <div class="skill-header">
                    <span>英语（四级）</span>
                    <span id="english-skill">75%</span>
                </div>
                <div class="skill-bar">
                    <div class="skill-fill" id="english-skill-bar" style="width: 75%;"></div>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>📅 今日状态</h2>
            <div class="status-grid">
                <div class="status-item">
                    <span class="status-label">心情</span>
                    <span class="status-value" id="mood-value">😊 7 / 10</span>
                </div>
                <div class="status-item">
                    <span class="status-label">精力</span>
                    <span class="status-value" id="energy-value">⚡ 8 / 10</span>
                </div>
                <div class="status-item">
                    <span class="status-label">专注时长</span>
                    <span class="status-value" id="focus-value">2 小时</span>
                </div>
            </div>
            <h3>今日计划</h3>
            <ul class="plan-list" id="plan-list">
                <li><input type="checkbox" id="plan-0"> 111</li>
                <li><input type="checkbox" id="plan-1"> 222</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>Built with HTML + CSS + Python · 2026</p>id
    </footer>
    <script>
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        if (localStorage.getItem(cb.id) === 'true') {
            cb.checked = true;
        }
    });
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
            localStorage.setItem(cb.id, cb.checked);
        });
    });
    </script>
    
</body>
</html>
